<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRICK RUNNER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-header">
        <div class="header-left title-page-hidden">
            <h1 class="game-title-glitch" data-text="BRICK RUNNER">BRICK RUNNER</h1>
            <div id="high-score-display" class="high-score-header"></div>
        </div>
        <div id="hack-mode-hud" class="hack-mode-hud"></div>
    </div>

    <div class="rogue-hud-row">
        <div id="rogue-hud" class="rogue-hud" style="display: none;">
            <span id="rogue-class-badge" class="rogue-class-badge">⚡ STRIKER • LVL 1/4</span>
            <div class="rogue-xp-track">
                <div id="rogue-xp-fill" class="rogue-xp-fill"></div>
                <span id="rogue-xp-text" class="rogue-xp-text">0/12 XP</span>
            </div>
            <div id="rogue-next-perk" class="rogue-next-perk"></div>
        </div>
    </div>

    <div id="game-area">
        <div id="click-to-start-overlay">
            <div class="attract-hero">
                <h2 class="attract-title" data-text="BRICK RUNNER">BRICK RUNNER</h2>
                <button type="button" class="attract-cta start-play-btn">CLICK TO BEGIN</button>
            </div>
        </div>

        <div class="game-stats-container">
            <span id="score" class="game-ui-text">Score: 0</span>
            <span id="score-multiplier" class="multiplier-badge" style="display: none;">2X</span>
        </div>

        <div id="aegis-barrier-bar" class="aegis-barrier-bar" style="display: none;"></div>

        <div id="hack-lighting-overlay" class="hack-lighting-overlay"></div>
        <canvas id="party-sparkler-canvas" class="party-sparkler-canvas" width="900" height="600"></canvas>
        <div id="hack-floor-watermark" class="hack-floor-watermark"></div>

        <div id="status-indicators"></div>
        <div id="notifications-container"></div>
        
        <div id="start-screen">
            <h1 class="game-title">BRICK RUNNER</h1>
            <div class="start-deck">
                <div id="callsign-builder" class="callsign-panel"></div>
                <div id="start-leaderboard" class="leaderboard-panel"></div>
            </div>
            <button id="start-play-btn" class="start-prompt start-play-btn" type="button">PLAY GAME</button>
        </div>
        
        <div id="ball"></div>
        <div id="paddle"></div>
        <div id="bricks-container"></div>
        <div id="game-message"></div>
        <div id="arcade-guide-modal" class="arcade-guide-modal" style="display: none;"></div>
        <div id="cyber-console-modal" class="cyber-console-modal" style="display: none;"></div>
    </div>

    <!-- ─── Bottom Entry Points & Controls Bar ─── -->
    <div id="tips-box" class="tips-box">
        <div class="tip-actions">
            <button id="pause-button" class="tip-next-btn tip-control-btn" type="button" style="display: none;">⏸ PAUSE [P]</button>
            <button id="reset-button" class="tip-next-btn tip-control-btn tip-restart-btn" type="button" style="display: none;">↻ RESTART</button>
            <button id="tip-console-btn" class="tip-next-btn tip-console-btn" type="button">💻 [~] HACK CONSOLE</button>
            <button id="tip-guide-btn" class="tip-next-btn tip-guide-btn" type="button">🕹️ [G] ARCADE MANUAL</button>
        </div>
    </div>
    
    <script type="module" src="./js/script.js"></script>
</body>
</html>
