<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRICK RUNNER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-header">
        <div class="header-left">
            <h1 class="game-title-glitch" data-text="BRICK RUNNER">BRICK RUNNER</h1>
            <div id="high-score-display" class="high-score-header"></div>
        </div>
        <div class="header-actions">
            <button id="pause-button" class="reset-button">Pause [P]</button>
            <button id="reset-button" class="reset-button">Restart</button>
        </div>
    </div>

    <div id="game-area">
        <div id="click-to-start-overlay">
            <div class="attract-screen-card">
                <span class="attract-kicker">★ NEON-CORP ENTERTAINMENT SYSTEM // 1989 COIN-OP ★</span>
                <div class="pixel-art-scene" aria-hidden="true">
                    <svg class="pixel-scene-svg" viewBox="0 0 160 78" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
                        <!-- Night sky & pixel stars -->
                        <rect width="160" height="78" fill="#070913"/>
                        <rect x="12" y="6" width="2" height="2" fill="#00ffff"/>
                        <rect x="38" y="10" width="1" height="1" fill="#ffffff"/>
                        <rect x="74" y="4" width="2" height="2" fill="#ffd700"/>
                        <rect x="118" y="7" width="1" height="1" fill="#ff00ff"/>
                        <rect x="144" y="5" width="2" height="2" fill="#00ff66"/>
                        <!-- Distant Cyberpunk Pixel Skyline -->
                        <rect x="4" y="42" width="14" height="26" fill="#0d1326"/>
                        <rect x="18" y="36" width="16" height="32" fill="#101830"/>
                        <rect x="21" y="39" width="2" height="2" fill="#00ffff"/>
                        <rect x="26" y="39" width="2" height="2" fill="#ff00ff"/>
                        <rect x="21" y="44" width="2" height="2" fill="#00ffff"/>
                        <rect x="126" y="38" width="18" height="30" fill="#101830"/>
                        <rect x="130" y="41" width="2" height="2" fill="#ffd700"/>
                        <rect x="136" y="41" width="2" height="2" fill="#00ffff"/>
                        <rect x="144" y="44" width="12" height="24" fill="#0d1326"/>
                        <!-- Synthwave Horizon Grid -->
                        <rect x="0" y="66" width="160" height="12" fill="#120824"/>
                        <rect x="0" y="66" width="160" height="1" fill="#ff00ff"/>
                        <rect x="0" y="70" width="160" height="1" fill="#7a0099"/>
                        <rect x="0" y="75" width="160" height="1" fill="#ff00ff"/>
                        <!-- 5 Rows of Pixel Art Arcade Bricks -->
                        <!-- Row 0: Magenta -->
                        <rect x="16" y="10" width="22" height="5" fill="#ff00ff"/><rect x="17" y="11" width="20" height="1" fill="#ff99ff"/>
                        <rect x="41" y="10" width="22" height="5" fill="#ff00ff"/><rect x="42" y="11" width="20" height="1" fill="#ff99ff"/>
                        <rect x="66" y="10" width="22" height="5" fill="#ff00ff"/><rect x="67" y="11" width="20" height="1" fill="#ff99ff"/>
                        <rect x="91" y="10" width="22" height="5" fill="#ff00ff"/><rect x="92" y="11" width="20" height="1" fill="#ff99ff"/>
                        <rect x="116" y="10" width="22" height="5" fill="#ff00ff"/><rect x="117" y="11" width="20" height="1" fill="#ff99ff"/>
                        <!-- Row 1: Red-Pink -->
                        <rect x="16" y="17" width="22" height="5" fill="#ff3366"/><rect x="17" y="18" width="20" height="1" fill="#ff99b3"/>
                        <rect x="41" y="17" width="22" height="5" fill="#ff3366"/><rect x="42" y="18" width="20" height="1" fill="#ff99b3"/>
                        <rect x="66" y="17" width="22" height="5" fill="#ff3366"/><rect x="67" y="18" width="20" height="1" fill="#ff99b3"/>
                        <rect x="91" y="17" width="22" height="5" fill="#ff3366"/><rect x="92" y="18" width="20" height="1" fill="#ff99b3"/>
                        <rect x="116" y="17" width="22" height="5" fill="#ff3366"/><rect x="117" y="18" width="20" height="1" fill="#ff99b3"/>
                        <!-- Row 2: Orange -->
                        <rect x="16" y="24" width="22" height="5" fill="#ff8c00"/><rect x="17" y="25" width="20" height="1" fill="#ffd280"/>
                        <rect x="41" y="24" width="22" height="5" fill="#ff8c00"/><rect x="42" y="25" width="20" height="1" fill="#ffd280"/>
                        <rect x="66" y="24" width="22" height="5" fill="#ff8c00"/><rect x="67" y="25" width="20" height="1" fill="#ffd280"/>
                        <rect x="91" y="24" width="22" height="5" fill="#ff8c00"/><rect x="92" y="25" width="20" height="1" fill="#ffd280"/>
                        <rect x="116" y="24" width="22" height="5" fill="#ff8c00"/><rect x="117" y="25" width="20" height="1" fill="#ffd280"/>
                        <!-- Row 3: Neon Green (middle brick exploding!) -->
                        <rect x="16" y="31" width="22" height="5" fill="#00ff00"/><rect x="17" y="32" width="20" height="1" fill="#b3ffb3"/>
                        <rect x="41" y="31" width="22" height="5" fill="#00ff00"/><rect x="42" y="32" width="20" height="1" fill="#b3ffb3"/>
                        <!-- Shattering brick shards at (66..88, 31) -->
                        <rect x="68" y="29" width="3" height="3" fill="#ffd700"/>
                        <rect x="76" y="33" width="4" height="3" fill="#00ffff"/>
                        <rect x="83" y="30" width="3" height="2" fill="#ff00ff"/>
                        <rect x="72" y="36" width="2" height="2" fill="#ffffff"/>
                        <rect x="91" y="31" width="22" height="5" fill="#00ff00"/><rect x="92" y="32" width="20" height="1" fill="#b3ffb3"/>
                        <rect x="116" y="31" width="22" height="5" fill="#00ff00"/><rect x="117" y="32" width="20" height="1" fill="#b3ffb3"/>
                        <!-- Row 4: Cyan -->
                        <rect x="16" y="38" width="22" height="5" fill="#00ffff"/><rect x="17" y="39" width="20" height="1" fill="#b3ffff"/>
                        <rect x="41" y="38" width="22" height="5" fill="#00ffff"/><rect x="42" y="39" width="20" height="1" fill="#b3ffff"/>
                        <rect x="116" y="38" width="22" height="5" fill="#00ffff"/><rect x="117" y="39" width="20" height="1" fill="#b3ffff"/>
                        <!-- Pixel Ball + Motion Trail -->
                        <rect x="66" y="54" width="3" height="3" fill="#00ffff" opacity="0.35"/>
                        <rect x="70" y="49" width="4" height="4" fill="#00ffff" opacity="0.6"/>
                        <rect x="74" y="42" width="7" height="7" fill="#ffd700"/>
                        <rect x="75" y="43" width="5" height="5" fill="#ffffaa"/>
                        <rect x="76" y="44" width="1" height="2" fill="#070913"/>
                        <rect x="79" y="44" width="1" height="2" fill="#070913"/>
                        <!-- Twin Pixel Laser Bolts -->
                        <rect x="55" y="46" width="2" height="8" fill="#ff2a55"/>
                        <rect x="101" y="46" width="2" height="8" fill="#ff2a55"/>
                        <!-- Pixel Neon Paddle -->
                        <rect x="52" y="62" width="54" height="5" fill="#00ffff"/>
                        <rect x="54" y="63" width="50" height="2" fill="#ffffff"/>
                        <rect x="52" y="61" width="4" height="2" fill="#ff2a55"/>
                        <rect x="102" y="61" width="4" height="2" fill="#ff2a55"/>
                    </svg>
                    <div id="loading-emoji" class="loading-emoji"></div>
                </div>
                <h2 class="attract-title">BRICK RUNNER</h2>
                <div class="attract-badges">
                    <span class="attract-pill">🪴 3× EXPANDO</span>
                    <span class="attract-pill">🎯 TWIN LASERS</span>
                    <span class="attract-pill">🧲 MAG-LOCK</span>
                    <span class="attract-pill">💻 5 HACK MODES</span>
                </div>
                <p class="attract-cta">🪙 INSERT COIN • CLICK TO BEGIN</p>
            </div>
        </div>

        <div class="game-stats-container">
            <span id="score" class="game-ui-text">Score: 0</span>
            <span id="score-multiplier" class="multiplier-badge" style="display: none;">2X Score Miltiplier!</span>
        </div>

        <div id="hack-lighting-overlay" class="hack-lighting-overlay"></div>
        <canvas id="party-sparkler-canvas" class="party-sparkler-canvas" width="900" height="600"></canvas>
        <div id="hack-floor-watermark" class="hack-floor-watermark"></div>
        <div id="hack-mode-hud" class="hack-mode-hud"></div>

        <div id="status-indicators"></div>
        <div id="notifications-container"></div>
        
        <div id="start-screen">
            <h1 class="game-title">BRICK RUNNER</h1>
            <div class="start-deck">
                <div id="callsign-builder" class="callsign-panel"></div>
                <div id="start-leaderboard" class="leaderboard-panel"></div>
            </div>
            <button id="start-play-btn" class="start-prompt start-play-btn" type="button">▶ PLAY GAME</button>
        </div>
        
        <div id="ball"></div>
        <div id="paddle"></div>
        <div id="bricks-container"></div>
        <div id="game-message"></div>
        <div id="arcade-guide-modal" class="arcade-guide-modal" style="display: none;"></div>
        <div id="cyber-console-modal" class="cyber-console-modal" style="display: none;"></div>
    </div>

    <!-- ─── Bottom Entry Points Bar ─── -->
    <div id="tips-box" class="tips-box">
        <div class="tip-actions">
            <button id="tip-console-btn" class="tip-next-btn tip-console-btn" type="button">💻 [~] HACK CONSOLE</button>
            <button id="tip-guide-btn" class="tip-next-btn tip-guide-btn" type="button">🕹️ [G] ARCADE MANUAL</button>
        </div>
    </div>
    
    <script type="module" src="./js/script.js"></script>
</body>
</html>
